# Serves the React app and forwards API/WebSocket traffic to the backend
# container, so the browser sees a single origin (like the Vite dev proxy).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Match the API's 1 GB upload limit (plus form overhead).
    client_max_body_size 1050m;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;  # stream uploads straight to the API
        proxy_read_timeout 300s;
    }

    location /socket.io/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;  # WebSocket handshake
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Built assets have content hashes in their names: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths (e.g. /matches/abc) load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
