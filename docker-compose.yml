# Football AI Tactical Analyst - service definitions.
#
# Start the infrastructure:   docker compose up -d
# Check it is healthy:        docker compose ps
# Stop it (data is kept):     docker compose down
#
# Values like ${POSTGRES_PASSWORD} are read from the .env file next to this one
# (copy .env.example to .env first).

services:
  # PostgreSQL: stores users, matches, jobs and analysis summaries.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis: holds the BullMQ job queue shared by the Node API and the Python worker.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Append-only file: queued jobs survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
